<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora — Pobieranie</title><style>:root{--bg:#fff6ea;--ink:#261923;--orange:#ff9b6e;--pink:#ff8fba;--purple:#9b88ff;--yellow:#ffd86c}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 10% 10%,#ffe0c9,transparent 30%),radial-gradient(circle at 90% 15%,#e9dfff,transparent 30%),var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--ink);padding:24px}.box{width:min(680px,100%);border:4px solid var(--ink);border-radius:32px;background:#fffdf8;padding:34px;box-shadow:12px 12px 0 var(--ink)}h1{font-size:clamp(38px,7vw,68px);line-height:.95;margin:0 0 14px}p{line-height:1.6;font-size:18px}.bar{height:22px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;margin:24px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--pink),var(--purple));transition:width .2s}.status{font-weight:800}.btn{display:inline-block;margin-top:18px;border:3px solid var(--ink);border-radius:16px;padding:13px 18px;background:var(--yellow);box-shadow:5px 5px 0 var(--ink);font-weight:900;color:var(--ink);text-decoration:none}.error{color:#b42318}</style></head><body><main class="box"><h1>Nexora 26<br>Virel Beta 1</h1><p>Przygotowuję publiczny plik ZIP. Nie używamy Google Drive ani logowania.</p><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">Start…</div><a class="btn" href="index.html#download">← Wróć do strony</a></main><script>(async()=>{const status=document.getElementById('status'),fill=document.getElementById('fill');try{let b64='';for(let i=0;i<7;i++){status.textContent=`Pobieranie części ${i+1}/7…`;const r=await fetch(`downloads/nexora-beta1.part${i}.b64?cb=20260809`,{cache:'no-store'});if(!r.ok)throw new Error(`część ${i+1}: HTTP ${r.status}`);b64+=(await r.text()).trim();fill.style.width=`${Math.round((i+1)/7*78)}%`}status.textContent='Składanie ZIP-a…';await new Promise(r=>setTimeout(r,40));const raw=atob(b64);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);fill.style.width='92%';const blob=new Blob([bytes],{type:'application/zip'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Nexora_26_Virel_Beta_1.zip';document.body.appendChild(a);status.textContent='Gotowe — pobieranie rozpoczęte.';fill.style.width='100%';a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}catch(e){status.classList.add('error');status.textContent='Błąd pobierania: '+e.message}})();</script></body></html>
